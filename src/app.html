<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width" />
    <title>Istigfarathon – Global Istighfar Counter</title>
    <meta
      name="description"
      content="Join the Istigfarathon and contribute your istighfar to a live counter for your masjid and community. Track progress towards collective goals and encourage remembrance."
    />
    <meta name="theme-color" content="#022C22" />

    <!-- Open Graph / social -->
    <meta property="og:title" content="Istigfarathon – Global Istighfar Counter" />
    <meta
      property="og:description"
      content="Add your istighfar, see your masjid's progress, and be part of a global wave of remembrance."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://istigfarathon.com/" />
    <meta property="og:image" content="%sveltekit.assets%/favicon.svg" />

    <!-- Basic Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Istigfarathon – Global Istighfar Counter" />
    <meta
      name="twitter:description"
      content="Add your istighfar and help your masjid reach its goal."
    />
    <meta name="twitter:image" content="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:opsz,wght@14..32,100..900&family=Poppins:wght@300;400&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body
    class="bg-[#FAFAFB] font-[Inter] text-sm text-[#56565C]"
    data-sveltekit-preload-data="hover"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
